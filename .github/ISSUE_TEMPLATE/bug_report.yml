name: Bug report
description: Report a reproducible Glassy UI bug.
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Link a repo, paste minimal code, or list exact local steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: 'Chrome 126, macOS 15'
